[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macchiavelli"
version = "0.1.0"
description = "Macchiavelli card game engine and RL agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
macchiavelli-sim = "macchiavelli.sim:main"
